[package]
name = "eon-foundation"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
aho-corasick = "1"
blake3 = "1"
crc32fast = "1"
eon-primitives = { path = "../eon-primitives" }
rusqlite = { version = "0.37", features = ["bundled"] }
