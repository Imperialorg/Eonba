[package]
name = "eon-kernel"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
blake3 = "1"
diffy = "0.4"
eon-cyber = { path = "../eon-cyber", default-features = false }
eon-foundation = { version = "0.1.0", path = "../eon-foundation" }
eon-primitives = { path = "../eon-primitives", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
proptest = "1"
tempfile = "3"
