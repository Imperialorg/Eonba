[package]
name = "eon-vision"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[features]
paddle-ocr = ["dep:image", "dep:ort", "dep:sha2", "eon-primitives/onnx-runtime"]
omniparser-icons = ["dep:image", "dep:ort", "dep:sha2", "eon-primitives/onnx-runtime"]

[dependencies]
eon-primitives = { path = "../eon-primitives" }
image = { version = "0.25.10", default-features = false, features = ["jpeg"], optional = true }
ort = { workspace = true, optional = true }
sha2 = { version = "0.10.9", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", features = ["fs"] }

[[test]]
name = "still_ocr"
required-features = ["paddle-ocr"]

[[test]]
name = "still_icons"
required-features = ["omniparser-icons"]
