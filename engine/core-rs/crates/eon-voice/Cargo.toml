[package]
name = "eon-voice"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[features]
default = ["native"]
# Headless model workers do not need microphone, playback or echo-canceller libraries.
onnx-speech = ["dep:kaldi-native-fbank", "dep:ort"]
native = ["onnx-speech", "dep:cpal", "dep:serde_json", "dep:webrtc-audio-processing", "dep:webrtc-audio-processing-config"]

[dependencies]
cpal = { version = "0.18", optional = true }
eon-primitives = { path = "../eon-primitives" }
kaldi-native-fbank = { version = "0.1", optional = true }
ort = { version = "=2.0.0-rc.15", features = ["download-binaries"], optional = true }
rtrb = "0.3"
rubato = "5.1"
serde_json = { version = "1", optional = true }
webrtc-audio-processing = { version = "2.1", features = ["bundled"], optional = true }
webrtc-audio-processing-config = { version = "2.1", optional = true }

[[test]]
name = "aec_alignment"
required-features = ["native"]

[[test]]
name = "asr_e2e"
required-features = ["onnx-speech"]

[[test]]
name = "device_loop"
required-features = ["native"]

[[test]]
name = "speaker_e2e"
required-features = ["native"]

[[test]]
name = "tts_e2e"
required-features = ["native"]

[[test]]
name = "vad_e2e"
required-features = ["onnx-speech"]
