[package]
name = "eon-mesh"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[features]
native-zipformer = ["dep:eon-voice", "dep:sha2", "dep:serde_json"]

[dependencies]
blake3 = "1"
bytes = "1"
eon-primitives = { path = "../eon-primitives" }
eon-voice = { path = "../eon-voice", optional = true, default-features = false, features = ["onnx-speech"] }
if-addrs = "0.15.0"
iroh = "1.4"
loro = "1"
mdns-sd = { version = "0.22.0", default-features = false, features = ["async"] }
postcard = { version = "1", features = ["alloc"] }
prost = "0.14.6"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", optional = true }
sha2 = { version = "0.10", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }

[dev-dependencies]
eon-cli = { path = "../eon-cli" }
eon-foundation = { path = "../eon-foundation" }
iroh-blobs = "0.105"
iroh-relay = { version = "1.4", features = ["server"] }
tempfile = "3"

[[test]]
name = "split_zipformer"
required-features = ["native-zipformer"]
