[package]
name = "eon-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[features]
# Builds without audio support still have the read-only journal console.
audio-input = ["dep:cpal"]

[dependencies]
cpal = { version = "0.18", optional = true }
crossterm = "0.28"
eon-foundation = { path = "../eon-foundation" }
eon-primitives = { path = "../eon-primitives" }
ratatui = "0.29"

[[bin]]
name = "eon"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3"
