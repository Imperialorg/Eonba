[package]
name = "eon-cyber"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[features]
default = ["solver"]
solver = ["dep:z3"]
self-fsync-ebpf = ["dep:eon-ebpf"]

[target.'cfg(target_os = "linux")'.dependencies]
eon-ebpf = { path = "../eon-ebpf", optional = true, default-features = false, features = ["self-fsync"] }

[dependencies]
eon-primitives = { path = "../eon-primitives" }
petgraph = "0.8"
serde_json = "1"
tree-sitter = "0.27"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
z3 = { version = "0.23", features = ["bundled"], optional = true }
