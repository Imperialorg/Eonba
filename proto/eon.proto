syntax = "proto3";

package eon.protocol;

option java_package = "com.eon.protocol";
option java_multiple_files = true;

// ============================================================================
// EON WIRE PROTOCOL CONTRACT (proto/eon.proto)
//
// Role & Scope:
// 1. Peer-to-Peer QUIC Mesh RPC (engine/core-rs/crates/eon-mesh): Cross-node
//    messaging between Android phones, desktop workstations, and servers.
// 2. Desktop Daemon IPC (clients/daemon): Named pipes (Windows) and Unix Domain
//    Sockets (Linux/macOS) for local process communication.
//
// NOTE: Mozilla UniFFI (eon_core.udl) governs in-process Foreign Function
// Interfaces (Rust <-> Kotlin/Swift). proto/eon.proto governs over-the-wire
// and cross-process byte serialization.
// ============================================================================

// --- Transport & QoS Enums ---

enum QuicPriorityClass {
  // Class 0: Real-time unreliable datagrams (RFC 9221). No head-of-line blocking.
  // Used for live 16kHz/24kHz PCM chunks, acoustic barge-in interrupts (< 5ms).
  CLASS_0_REALTIME_DATAGRAM = 0;

  // Class 1: High-priority control streams. Reliable, low-latency.
  // Used for Cognitive Epoch invalidations, streaming LLM tokens, lease heartbeats.
  CLASS_1_CONTROL_STREAM = 1;

  // Class 2: Interactive state streams. Reliable, state-synchronous.
  // Used for Loro/Automerge CRDT delta-syncs, compressed video keyframes, UI trees.
  CLASS_2_INTERACTIVE_STATE = 2;

  // Class 3: Bulk background streams. Bandwidth-throttled.
  // Used for model weights, large git blobs, build artifacts, file transfers.
  CLASS_3_BULK_BACKGROUND = 3;
}

enum Priority {
  PRIORITY_UNSPECIFIED = 0;
  PRIORITY_LOW = 1;
  PRIORITY_NORMAL = 2;
  PRIORITY_HIGH = 3;
  PRIORITY_CRITICAL = 4;
}

enum ExecutionStatus {
  STATUS_UNSPECIFIED = 0;
  STATUS_PENDING = 1;
  STATUS_RUNNING = 2;
  STATUS_VERIFYING = 3;
  STATUS_COMPLETED = 4;
  STATUS_FAILED = 5;
  STATUS_CANCELLED = 6;
  STATUS_UNCERTAIN_FAILURE = 7;
}

// --- IPC & Core Messages ---

message ObjectiveSubmission {
  string objective_id = 1; // "obj_<ULID>"
  string owner_id = 2;     // "id_<ULID>"
  string description = 3;
  Priority priority = 4;
  int64 created_at_ns = 5;
  uint64 cognitive_epoch = 6;
}

message TaskExecutionRequest {
  string task_id = 1;       // "task_<ULID>"
  string workflow_id = 2;   // "wf_<ULID>"
  string capability_id = 3; // e.g. "workspace.read@v1", "dev.lsp@v1"
  string operation = 4;     // e.g. "read_range", "goto_definition"
  string parameters_json = 5;
  int64 timeout_ms = 6;
  uint64 cognitive_epoch = 7;
  bool is_speculative = 8;
}

message TaskExecutionOutcome {
  string task_id = 1;
  ExecutionStatus status = 2;
  string outcome_json = 3;
  string error_code = 4;
  string error_message = 5;
  string verification_digest = 6;
  int64 executed_duration_ns = 7;
}

message EpochInvalidationEvent {
  uint64 invalidated_epoch = 1;
  uint64 new_epoch = 2;
  string reason = 3;
  int64 timestamp_ns = 4;
  bool requires_saga_rollback = 5;
}

// --- Voice & Perception Messages ---

message AudioPcmChunk {
  int64 sequence_number = 1;
  int64 timestamp_ms = 2;
  bytes pcm_data = 3; // 16kHz (input) or 24kHz (output) 16-bit mono PCM
  QuicPriorityClass priority_class = 4;
}

message TranscriptToken {
  string token = 1;
  bool is_final = 2;
  float confidence = 3;
  int64 start_time_ms = 4;
  int64 end_time_ms = 5;
  bool is_thought_token = 6; // true if within <think>...</think> scratchpad
}

message BargeInSignal {
  int64 timestamp_ms = 1;
  float confidence = 2;
  string reason = 3;
  int64 verified_speaker_score = 4; // Biometric speaker verification score
}

// --- Multimodal Vision Messages ---

message VideoKeyframeChunk {
  int64 sequence_number = 1;
  int64 timestamp_ms = 2;
  bytes jpeg_bytes = 3;
  uint32 width = 4;
  uint32 height = 5;
  bool is_scene_transition = 6;
  float optical_flow_delta = 7;
}

message UiBoundingBox {
  uint32 element_id = 1;
  string element_type = 2; // "button", "input", "text", "icon"
  float x_min = 3;
  float y_min = 4;
  float x_max = 5;
  float y_max = 6;
  string text_content = 7;
  bool is_clickable = 8;
  uint32 mark_id = 9;      // Set-of-Mark discrete visual tag ([1], [2], [3]...)
}

message ScreenPerceptionFrame {
  int64 timestamp_ms = 1;
  repeated UiBoundingBox detected_elements = 2;
  string active_package_name = 3;
  string active_window_title = 4;
}

// --- Distributed Mesh & CRDT Messages ---

message MeshPeerInfo {
  string peer_id = 1;     // Ed25519 node public key string
  string device_name = 2;
  string device_type = 3; // "android", "workstation", "server"
  repeated string available_capabilities = 4;
  int64 ping_latency_ms = 5;
  repeated string direct_addrs = 6; // IP:Port addresses discovered via STUN/iroh
}

message CrdtDeltaSync {
  string ledger_id = 1;
  int64 lamport_clock = 2;
  bytes crdt_delta_payload = 3; // Loro or Automerge encoded delta
}

message SplitInferencePayload {
  string session_id = 1;
  repeated string partial_tokens = 2;
  string target_model = 3;
  bytes audio_stream_ref = 4;
  QuicPriorityClass priority_class = 5;
}

// --- Spatial Arbitration (Single Mind, Multiple Bodies) ---

message SensoryClaim {
  string claim_id = 1;          // ULID format
  string device_id = 2;         // Peer Ed25519 node public key
  int64 timestamp_ns = 3;       // Hardware monotonic timestamp
  float audio_rms_db = 4;       // Root-mean-square microphone energy
  float snr_score = 5;          // Signal-to-Noise Ratio computed by Silero VAD
  bool is_screen_unlocked = 6;  // Whether screen is active & unlocked
  bool has_active_hid_input = 7;// Recent mouse/keyboard input within 10s
  string current_mode = 8;      // Active macro operating mode name
}

message SpatialElectionResult {
  string claim_id = 1;
  string elected_io_leader_id = 2;
  int64 lease_duration_ms = 3; // Typically 5000ms, refreshed on continued speech
  bool suppress_tts = 4;       // True for follower nodes to silence local speakers
}

// --- Stateful Interactive PTY Streams ---

message PtyChunk {
  string session_id = 1;
  int64 sequence_number = 2;
  bytes data = 3;
  bool is_stderr = 4;
}

message PtySignal {
  string session_id = 1;
  int32 signal_number = 2; // e.g. SIGINT (2), SIGTERM (15), SIGWINCH (28)
  uint32 cols = 3;
  uint32 rows = 4;
}

// --- Neuro-Symbolic Reasoning Messages ---

message SmtSolverRequest {
  string query_id = 1;         // "query_<ULID>"
  string smt_lib2_formula = 2; // SMT-LIB2 formula string
  int64 timeout_ms = 3;        // Hard solver timeout (default 5000ms)
  string logic = 4;             // e.g. "QF_LIA", "QF_BV", "ALL"
}

message SmtSolverOutcome {
  string query_id = 1;
  bool is_satisfiable = 2;     // true if SAT, false if UNSAT
  string model_json = 3;       // Variable assignment mapping when SAT
  string unsat_core = 4;       // Minimal unsatisfiable core when UNSAT
  int64 solver_duration_ns = 5;
}


